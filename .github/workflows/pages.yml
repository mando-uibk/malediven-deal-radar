name: Malediven Deal Radar veröffentlichen

on:
  push:
    branches: [main, master]
    paths:
      - "data/latest-offers.json"
      - "config/**"
      - "src/**"
      - "package.json"
      - ".env.publish"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository laden
        uses: actions/checkout@v6
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Angebote prüfen
        run: npm test
      - name: Mobile Seite erzeugen
        run: npm run publish
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Mobile Seite hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
